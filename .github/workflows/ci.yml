name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      -  master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: plateia_test
          POSTGRES_PASSWORD: plateia_test_password
          POSTGRES_DB: plateia_test
          JWT_SECRET: "ci-only-secret-not-for-production-at-least-32-characters"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plateia_test -d plateia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3333
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://plateia_test:plateia_test_password@localhost:5432/plateia_test?schema=public
      JWT_SECRET: "ci-only-secret-not-for-production-at-least-32-characters"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate --workspace apps/api

      - name: Validar lint
        run: npm run lint

      - name: Validar tipos
        run: npm run typecheck

      - name: Aplicar migrations
        run: npm run prisma:migrate:deploy --workspace apps/api

      - name: Executar testes
        run: npm test

      - name: Gerar builds
        run: npm run build